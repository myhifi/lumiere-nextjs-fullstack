name: CI

# ═══════════════════════════════════════════════════
# 🔍 GitHub Actions — فحص تلقائي للكود
# ═══════════════════════════════════════════════════
# • يُشغَّل عند كل push أو pull request إلى main
# • يفحص TypeScript، Prisma، وبناء الإنتاج
# • مجاني بالكامل للمستودعات العامة

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type Check & Build
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. تثبيت Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. تثبيت الحزم
      - name: Install dependencies
        run: npm ci

      # 4. توليد Prisma Client
      - name: Generate Prisma Client
        run: npx prisma generate

      # 5. فحص TypeScript
      - name: TypeScript type check
        run: npx tsc --noEmit

      # 6. بناء الإنتاج
      - name: Build for production
        run: npm run build
        env:
          # متغيرات وهمية — لا تُستخدم فعلياً في الفحص
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          DIRECT_URL: "postgresql://user:pass@localhost:5432/db"
          AUTH_SECRET: "ci-test-secret-not-used-in-production-000000000000000000000"
          EMAIL_PROVIDER: "console"